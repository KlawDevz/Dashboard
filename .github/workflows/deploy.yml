name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm install -g http-server

    - name: Build project
      run: |
        # Pour l'instant, il n'y a pas de build spécifique
        # Copier les fichiers publics dans le répertoire de déploiement
        mkdir -p dist
        cp -r public/* dist/
        
        # Remplacer les placeholders par les vraies valeurs
        if [ -n "$SUPABASE_URL" ]; then
          find dist -type f -exec sed -i "s|{{SUPABASE_URL}}|$SUPABASE_URL|g" {} +
        fi
        
        if [ -n "$SUPABASE_ANON_KEY" ]; then
          find dist -type f -exec sed -i "s|{{SUPABASE_ANON_KEY}}|$SUPABASE_ANON_KEY|g" {} +
        fi

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}